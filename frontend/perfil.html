<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta | Breck Barber</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="cabecalho"></div>

  <main class="container">
    <section class="secao">
      <div class="secao__cabecalho">
        <div>
          <span class="secao__etiqueta">Sua conta</span>
          <h2>Minha conta</h2>
          <p>Rota privada: os dados sao carregados com o token JWT em GET /usuarios/perfil.</p>
        </div>
      </div>

      <div class="kpis" id="kpisPerfil"></div>

      <div class="aviso aviso--erro" id="avisoPerfil" hidden></div>
      <div class="aviso aviso--ok" id="sucessoPerfil" hidden></div>

      <div class="painel form-largo" style="margin-top:0">
        <h3>Dados cadastrais</h3>
        <p class="painel__sub">
          Salvar tudo usa <strong>PUT /usuarios/:id</strong>. Alterar so a senha usa <strong>PATCH /usuarios/:id</strong>.
        </p>

        <form id="formPerfil" novalidate>
          <div class="form-grade">
            <div class="campo span-2">
              <label for="nome">Nome completo *</label>
              <input type="text" id="nome" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="cpf">CPF <small>(nao editavel)</small></label>
              <input type="text" id="cpf" disabled>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" inputmode="numeric" maxlength="15">
              <span class="campo__erro"></span>
            </div>

            <div class="campo span-2">
              <label for="email">E-mail *</label>
              <input type="email" id="email" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="cep">CEP *</label>
              <input type="text" id="cep" inputmode="numeric" maxlength="9" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="numero">Numero *</label>
              <input type="text" id="numero" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo span-2">
              <label for="logradouro">Rua / logradouro *</label>
              <input type="text" id="logradouro" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="bairro">Bairro *</label>
              <input type="text" id="bairro" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento">
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="cidade">Cidade *</label>
              <input type="text" id="cidade" required>
              <span class="campo__erro"></span>
            </div>

            <div class="campo">
              <label for="uf">UF *</label>
              <input type="text" id="uf" maxlength="2" required>
              <span class="campo__erro"></span>
            </div>
          </div>

          <button type="submit" class="btn btn--primario" style="margin-top:20px" id="btnSalvar">
            Salvar alteracoes (PUT)
          </button>
        </form>
      </div>

      <div class="painel form-largo">
        <h3>Alterar senha</h3>
        <p class="painel__sub">Atualizacao parcial via PATCH: somente o campo senha e enviado.</p>

        <form id="formSenha" novalidate>
          <div class="form-grade">
            <div class="campo">
              <label for="novaSenha">Nova senha *</label>
              <input type="password" id="novaSenha" autocomplete="new-password" required>
              <span class="campo__erro"></span>
            </div>
            <div class="campo">
              <label for="confirmaSenha">Confirmar nova senha *</label>
              <input type="password" id="confirmaSenha" autocomplete="new-password" required>
              <span class="campo__erro"></span>
            </div>
          </div>

          <button type="submit" class="btn btn--contorno" style="margin-top:18px" id="btnSenha">
            Atualizar senha (PATCH)
          </button>
        </form>
      </div>
    </section>
  </main>

  <div id="rodape"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validacoes.js"></script>
  <script>
    (async function telaPerfil() {
      UI.montarCabecalho('perfil');
      UI.montarRodape();

      if (!Auth.protegerPagina()) return;

      Validar.ligarMascara('cep', Validar.mascaraCEP);
      Validar.ligarMascara('telefone', Validar.mascaraTelefone);
      document.getElementById('uf').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
      });

      ViaCep.ligar(
        { cep: 'cep', logradouro: 'logradouro', bairro: 'bairro', cidade: 'cidade', uf: 'uf', numero: 'numero' },
        (mensagem, tipo) => UI.aviso(mensagem, tipo === 'ok' ? 'ok' : tipo === 'erro' ? 'erro' : 'info', 2600)
      );

      let usuario;
      try {
        usuario = await API.meuPerfil();
      } catch (e) {
        UI.mensagem('avisoPerfil', e.message);
        return;
      }

      const preencher = (id, valor) => { document.getElementById(id).value = valor ?? ''; };

      preencher('nome', usuario.nome);
      preencher('cpf', Validar.mascaraCPF(usuario.cpf));
      preencher('telefone', usuario.telefone);
      preencher('email', usuario.email);
      preencher('cep', Validar.mascaraCEP(usuario.cep));
      preencher('numero', usuario.numero);
      preencher('logradouro', usuario.logradouro);
      preencher('bairro', usuario.bairro);
      preencher('complemento', usuario.complemento);
      preencher('cidade', usuario.cidade);
      preencher('uf', usuario.uf);

      // KPIs da conta
      const pedidos = usuario.pedidos || [];
      const gasto = pedidos
        .filter((p) => p.status !== 'CANCELADO')
        .reduce((s, p) => s + Number(p.total), 0);

      document.getElementById('kpisPerfil').innerHTML = `
        <div class="kpi"><div class="kpi__rotulo">Perfil</div><div class="kpi__valor kpi__valor--acento">${escapar(usuario.perfil)}</div><div class="kpi__nota">${escapar(usuario.email)}</div></div>
        <div class="kpi"><div class="kpi__rotulo">Pedidos realizados</div><div class="kpi__valor">${pedidos.length}</div><div class="kpi__nota">Historico completo em Meus Pedidos</div></div>
        <div class="kpi"><div class="kpi__rotulo">Total em compras</div><div class="kpi__valor">${moeda(gasto)}</div><div class="kpi__nota">Desconsidera pedidos cancelados</div></div>
        <div class="kpi"><div class="kpi__rotulo">Cliente desde</div><div class="kpi__valor" style="font-size:1.25rem">${dataBR(usuario.created_at)}</div><div class="kpi__nota">Conta ${usuario.ativo ? 'ativa' : 'inativa'}</div></div>`;

      // ---- PUT: registro completo ----
      document.getElementById('formPerfil').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        UI.mensagem('avisoPerfil', '');
        UI.mensagem('sucessoPerfil', '');

        const valor = (id) => document.getElementById(id).value.trim();
        const erros = [];

        ['nome', 'email', 'cep', 'numero', 'logradouro', 'bairro', 'cidade', 'uf'].forEach((id) => {
          Validar.marcarErro(id, '');
          if (!valor(id)) { Validar.marcarErro(id, 'Campo obrigatorio.'); erros.push(id); }
        });
        if (!erros.includes('email') && !Validar.email(valor('email'))) {
          Validar.marcarErro('email', 'E-mail invalido.'); erros.push('email');
        }
        if (Validar.digitos(valor('cep')).length !== 8) {
          Validar.marcarErro('cep', 'CEP deve ter 8 digitos.'); erros.push('cep');
        }

        if (erros.length) { UI.mensagem('avisoPerfil', 'Corrija os campos destacados.'); return; }

        const botao = document.getElementById('btnSalvar');
        botao.disabled = true;
        botao.textContent = 'Salvando...';

        try {
          const atualizado = await API.put(`/usuarios/${usuario.id}`, {
            nome: valor('nome'),
            email: valor('email'),
            telefone: valor('telefone') || null,
            cep: Validar.digitos(valor('cep')),
            logradouro: valor('logradouro'),
            numero: valor('numero'),
            complemento: valor('complemento') || null,
            bairro: valor('bairro'),
            cidade: valor('cidade'),
            uf: valor('uf'),
          });

          Auth.atualizarUsuario(atualizado);
          UI.mensagem('sucessoPerfil', 'Dados atualizados com sucesso.', 'ok');
          UI.aviso('Cadastro atualizado.', 'ok');
          UI.montarCabecalho('perfil');
        } catch (e) {
          UI.mensagem('avisoPerfil', e.message);
        } finally {
          botao.disabled = false;
          botao.textContent = 'Salvar alteracoes (PUT)';
        }
      });

      // ---- PATCH: apenas a senha ----
      document.getElementById('formSenha').addEventListener('submit', async (evento) => {
        evento.preventDefault();
        UI.mensagem('avisoPerfil', '');
        UI.mensagem('sucessoPerfil', '');

        const nova = document.getElementById('novaSenha').value;
        const confirma = document.getElementById('confirmaSenha').value;

        Validar.marcarErro('novaSenha', '');
        Validar.marcarErro('confirmaSenha', '');

        if (nova.length < 6) { Validar.marcarErro('novaSenha', 'Minimo de 6 caracteres.'); return; }
        if (nova !== confirma) { Validar.marcarErro('confirmaSenha', 'As senhas nao conferem.'); return; }

        const botao = document.getElementById('btnSenha');
        botao.disabled = true;
        botao.textContent = 'Atualizando...';

        try {
          await API.patch(`/usuarios/${usuario.id}`, { senha: nova });
          document.getElementById('formSenha').reset();
          UI.mensagem('sucessoPerfil', 'Senha atualizada. Use a nova senha no proximo login.', 'ok');
          UI.aviso('Senha atualizada.', 'ok');
        } catch (e) {
          UI.mensagem('avisoPerfil', e.message);
        } finally {
          botao.disabled = false;
          botao.textContent = 'Atualizar senha (PATCH)';
        }
      });
    })();
  </script>
</body>
</html>
